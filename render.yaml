services:
  - type: web
    name: natal-atlas-alpha1
    runtime: docker
    plan: free
    region: frankfurt
    branch: codex/alpha-1
    dockerfilePath: ./ops/Render.Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: natal-atlas-alpha1-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALPHA_ADMIN_PASSWORD
        generateValue: true
      - key: SWISSEPH_LICENSE_MODE
        value: AGPL
      - key: LICENSE_ACKNOWLEDGED
        value: 'yes'
      - key: APP_RELEASE
        value: Alpha 1
databases:
  - name: natal-atlas-alpha1-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
    databaseName: natal_alpha1
    user: natal_alpha1
    ipAllowList: []
