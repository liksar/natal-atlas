name: Validate native architectures
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: natal
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: natal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U natal -d natal"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-placeholder-that-is-not-used-for-any-production-deployment
      POSTGRES_HOST: localhost
      POSTGRES_USER: natal
      POSTGRES_PASSWORD: ci-only-database-password
      POSTGRES_DB: natal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --frozen --python 3.12
      - run: uv run python ops/setup_data.py
      - run: uv run python backend/manage.py migrate --noinput
      - run: uv run python backend/manage.py test charts
      - run: npm ci --prefix frontend && npm test --prefix frontend && npm run build --prefix frontend
      - run: docker build -t natal-atlas:test .
      - run: docker build -f ops/Caddy.Dockerfile -t natal-atlas-caddy:test .
      - name: Production settings checks
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: atlas.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://atlas.example.com
        run: uv run python backend/manage.py check --deploy --fail-level WARNING
