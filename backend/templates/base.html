{% load static %}<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="{% if hide_language_switch %}no-referrer{% else %}same-origin{% endif %}"><meta name="robots" content="noindex,nofollow,noarchive"><title>{{ t.brand }}</title><link rel="stylesheet" href="{% static 'atlas.css' %}"><script type="module" src="{% static 'atlas.js' %}"></script></head>
<body><div class="nebula" aria-hidden="true"></div><header class="site-header"><a class="brand" href="/">✧ <span>{{ t.brand }}</span></a>{% if not hide_language_switch %}<form class="language" method="get"><label for="language">◎</label><select id="language" name="lang" aria-label="Language"><option value="en" {% if lang == 'en' %}selected{% endif %}>English</option><option value="uk" {% if lang == 'uk' %}selected{% endif %}>Українська</option><option value="ru" {% if lang == 'ru' %}selected{% endif %}>Русский</option></select><button type="submit">↵</button></form>{% endif %}</header>
<main>{% block content %}{% endblock %}</main><footer><span>✧ {{ t.brand }}</span>{% if release_label %}<p>{{ release_label }}</p>{% endif %}<p>{{ t.disclaimer }}</p>{% if source_url %}<a href="{{ source_url }}" rel="noreferrer">{{ t.source }}</a>{% endif %}</footer><div id="toast" role="status" aria-live="polite"></div></body></html>
